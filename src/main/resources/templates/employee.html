
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 20px;
            background: #f4f6f9;
            color: #222;
        }

        h1, h2 { color: #17365d; }

        form, .panel {
            background: white;
            padding: 20px;
            margin-bottom: 24px;
            border-radius: 8px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px 0;
            box-sizing: border-box;
        }

        input { width: 100%; }
        button, .edit {
            cursor: pointer;
            padding: 9px 14px;
            border: none;
            border-radius: 4px;
            background: #1769aa;
            color: white;
            text-decoration: none;
        }

        .delete { background: #c62828; }
        .error { color: #c62828; font-size: 13px; }
        .success { color: #167a36; }
        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }

        th { background: #17365d; color: white; }
        .actions { display: flex; gap: 8px; align-items: center; }
        .actions form { padding: 0; margin: 0; }
    </style>
</head>
<body>

<h1>Employee Management System</h1>
<p>Register and manage company employees.</p>

<p class="success" th:if="${successMessage}"
   th:text="${successMessage}"></p>

<section class="panel">
    <h2>Register New Employee</h2>

    <form th:action="@{/employees}" th:object="${employee}"
          method="post">

        <label>Full Name</label>
        <input type="text" th:field="*{fullName}">
        <div class="error" th:errors="*{fullName}"></div>

        <label>Email</label>
        <input type="email" th:field="*{email}">
        <div class="error" th:errors="*{email}"></div>

        <label>Phone (10 digits)</label>
        <input type="text" th:field="*{phone}">
        <div class="error" th:errors="*{phone}"></div>

        <label>Department</label>
        <input type="text" th:field="*{department}">
        <div class="error" th:errors="*{department}"></div>

        <label>Salary</label>
        <input type="number" step="0.01" th:field="*{salary}">
        <div class="error" th:errors="*{salary}"></div>

        <button type="submit">Save Employee</button>
    </form>
</section>

<section class="panel">
    <h2>Employee List</h2>

    <form th:action="@{/employees}" method="get">
        <label>Search by employee name</label>
        <input type="text" name="keyword" th:value="${keyword}"
               placeholder="Enter a name">
        <button type="submit">Search</button>
        <a href="/employees">Clear Search</a>
    </form>

    <p>Total employees shown:
        <strong th:text="${#lists.size(employees)}">0</strong>
    </p>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="emp : ${employees}">
                <td th:text="${emp.id}"></td>
                <td th:text="${emp.fullName}"></td>
                <td th:text="${emp.email}"></td>
                <td th:text="${emp.phone}"></td>
                <td th:text="${emp.department}"></td>
                <td th:text="${emp.salary}"></td>

                <td>
                    <div class="actions">
                        <a class="edit"
                           th:href="@{/employees/{id}/edit(id=${emp.id})}">
                            Edit
                        </a>

                        <form
                            th:action="@{/employees/{id}/delete(id=${emp.id})}"
                            method="post"
                            onsubmit="return confirm('Delete this employee?');">
                            <button class="delete" type="submit">
                                Delete
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(employees)}">
                <td colspan="7">No employees found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>

</body>
</html>
